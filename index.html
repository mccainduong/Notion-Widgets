<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Tracker</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #widget-wrapper {
      width: 200px;
      height: 127px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="widget-wrapper">
    <!-- START CODE -->
    <script>
      var fm = "USD";
      var to = "JPY";
      var tz = "-8";
      var sz = "200x127";
      var lg = "en";
      var st = "primary";
      var cd = 1;
      var am = 1;
    </script>
    <script src="https://currencyrate.today/exchangerates"></script>
    <!-- END CODE -->
  </div>

  <script>
    function resizeWidget() {
      const wrapper = document.getElementById('widget-wrapper');
      const scaleX = window.innerWidth / 200;
      const scaleY = window.innerHeight / 127;
      // Math.min preserves aspect ratio (no stretching).
      // Swap to scale(${scaleX}, ${scaleY}) if you want it to fully fill the box.
      const scale = Math.min(scaleX, scaleY);
      wrapper.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeWidget);
    window.addEventListener('load', resizeWidget);
    resizeWidget();
  </script>
</body>
</html>
